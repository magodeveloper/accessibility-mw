version: 2
updates:
  # Mantener dependencias de npm actualizadas
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    assignees:
      - 'magodeveloper'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    ignore:
      # Ignorar actualizaciones mayores de algunas dependencias críticas
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Mantener GitHub Actions actualizadas
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    commit-message:
      prefix: 'chore(ci)'
      include: 'scope'

  # Mantener Dockerfile actualizado
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    commit-message:
      prefix: 'chore(docker)'
      include: 'scope'
