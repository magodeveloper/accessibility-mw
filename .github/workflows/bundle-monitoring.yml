name: Bundle Monitoring

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'webpack.config.js'
  push:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  bundle-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Run bundle monitoring
        id: bundle-analysis
        run: |
          npm run bundle:full

          # Capturar el tamaño total para usar en comentarios
          if [ -f "reports/bundle/latest.json" ]; then
            TOTAL_SIZE=$(node -p "JSON.parse(require('fs').readFileSync('reports/bundle/latest.json', 'utf8')).bundle.summary.totalSizeFormatted")
            echo "total-size=${TOTAL_SIZE}" >> $GITHUB_OUTPUT
            
            # Verificar si hay alertas
            if [ -f "reports/bundle/BUNDLE_REPORT.md" ]; then
              echo "bundle-report-exists=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request' && steps.bundle-analysis.outputs.total-size
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './reports/bundle/BUNDLE_REPORT.md';

            if (fs.existsSync(path)) {
              const report = fs.readFileSync(path, 'utf8');
              const bundleSize = '${{ steps.bundle-analysis.outputs.total-size }}';
              
              // Crear comentario resumido
              const comment = `
            ## 📦 Bundle Size Analysis

            **Total Bundle Size:** ${bundleSize}

            <details>
            <summary>📊 Detailed Report</summary>

            ${report}

            </details>

            ---
            *Bundle monitoring automatically generated by GitHub Actions*
            `;
              
              // Buscar comentario anterior
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              
              const existingComment = comments.find(
                comment => comment.body.includes('Bundle Size Analysis')
              );
              
              if (existingComment) {
                // Actualizar comentario existente
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: comment
                });
              } else {
                // Crear nuevo comentario
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment
                });
              }
            }

      - name: Check bundle size limits
        run: node scripts/check-bundle-limits.js

      - name: Upload bundle reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis-report
          path: |
            reports/bundle/
          retention-days: 30

      - name: Store bundle metrics
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Guardar métricas históricas para comparación futura
          mkdir -p .github/bundle-history
          if [ -f "reports/bundle/latest.json" ]; then
            cp reports/bundle/latest.json .github/bundle-history/$(date +%Y%m%d_%H%M%S).json
            
            # Mantener solo los últimos 10 reportes
            cd .github/bundle-history
            ls -1t *.json | tail -n +11 | xargs -r rm
          fi

  bundle-comparison:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    needs: bundle-analysis

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build current branch
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run bundle:monitor
          cp reports/bundle/latest.json /tmp/current-bundle.json

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Build base branch
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run bundle:monitor
          cp reports/bundle/latest.json /tmp/base-bundle.json

      - name: Compare bundle sizes
        run: node scripts/compare-bundle-sizes.js
