name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"

env:
  NODE_VERSION: "20"
  NODE_ENV: "test"
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=2048"

jobs:
  build-and-quality:
    name: Build & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Lint code
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup test directories
        run: bash scripts/setup-test-dirs.sh

      - name: Run unit tests with optimizations
        run: |
          npx jest tests/unit \
            --testTimeout=30000 \
            --coverage \
            --maxWorkers=2 \
            --logHeapUsage \
            --detectOpenHandles \
            --config=jest.ci.config.js
        env:
          NODE_ENV: test
          CI: true
          ANALYSIS_API_URL: http://localhost:8082
          REPORTS_API_URL: http://reports.internal:8080
          JEST_TIMEOUT: 30000

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: unit-tests-coverage
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start supporting services
        run: |
          docker compose -f docker-compose.ci.yml up -d mysql-analysis mysql-reports ms-analysis ms-reports

          timeout 120 bash -c 'until docker compose -f docker-compose.ci.yml ps | grep -q "healthy"; do sleep 2; done' || {
            echo "Services failed to start. Logs:"
            docker compose -f docker-compose.ci.yml logs
            exit 1
          }

          docker compose -f docker-compose.ci.yml ps

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Playwright browsers
        run: |
          npx playwright install chromium
          npx playwright --version
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Setup test environment
        run: bash scripts/setup-test-dirs.sh

      - name: Run integration tests
        run: |
          npx jest tests/integration \
            --testTimeout=60000 \
            --maxWorkers=1 \
            --detectOpenHandles \
            --config=jest.ci.config.js
        env:
          NODE_ENV: test
          CI: true
          ANALYSIS_API_URL: http://localhost:8082
          REPORTS_API_URL: http://localhost:8080
          JEST_TIMEOUT: 60000
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

      - name: Cleanup services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml logs ms-analysis ms-reports
          docker compose -f docker-compose.ci.yml down -v

  docker-build-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-quality, test-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t accessibility-mw:${{ github.sha }} .
          docker tag accessibility-mw:${{ github.sha }} accessibility-mw:latest

      - name: Test Docker image
        run: |
          trap 'echo "Docker test failed. Capturing logs..."; docker logs test-container || echo "No logs available"; docker stop test-container 2>/dev/null || true' ERR

          docker run --rm -d --name test-container \
            -p 3001:3001 \
            -e NODE_ENV=production \
            accessibility-mw:${{ github.sha }}

          HEALTH_CHECK_PASSED=false
          for i in {1..30}; do
            if curl -f http://localhost:3001/health 2>/dev/null; then
              echo "Health check passed"
              HEALTH_CHECK_PASSED=true
              break
            fi
            echo "Waiting for service... ($i/30)"
            sleep 2
          done

          if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
            echo "Health check timeout after 60 seconds"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

          echo "Running smoke tests..."
          if ! curl -f http://localhost:3001/health; then
            echo "Smoke test failed"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

          echo "All smoke tests passed"
          docker stop test-container

  ci-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-quality, test-unit, test-integration, docker-build-test]

    steps:
      - name: Generate CI Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Code Quality: ${{ needs.build-and-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.test-integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build & Test: ${{ needs.docker-build-test.result }}" >> $GITHUB_STEP_SUMMARY
