name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"

env:
  NODE_VERSION: "20"
  NODE_ENV: "test"
  CI: "true"
  NODE_OPTIONS: "--max-old-space-size=2048"

jobs:
  build-and-quality:
    name: Build & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Lint code
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup test directories
        run: |
          mkdir -p .achecker_cache/engine tmp/test-data
          chmod -R 755 .achecker_cache tmp 2>/dev/null || true
          ls -la .achecker_cache/ || true
          echo "Test directories created successfully"

      - name: Run unit tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          CI: true
          ANALYSIS_API_URL: http://localhost:8082
          REPORTS_API_URL: http://localhost:8083
          COLLECT_COVERAGE: true
          JEST_TIMEOUT: 60000

      - name: Debug test failure
        if: failure()
        run: |
          echo "=== Test execution failed. Checking environment ==="
          node --version
          npm --version
          echo "=== Node modules integrity ==="
          npm list jest ts-jest --depth=0 || true
          echo "=== Environment variables ==="
          env | grep -E "(NODE_|JEST_|CI)" || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: unit-tests-coverage
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start supporting services (MySQL only)
        run: |
          # Iniciar solo MySQL para tests de integración
          # Los microservicios .NET no son necesarios para los tests actuales
          docker compose -f docker-compose.ci.yml up -d mysql-analysis mysql-reports

          echo "Waiting for MySQL services to be healthy (max 120s)..."
          timeout 120 bash -c 'until docker compose -f docker-compose.ci.yml ps mysql-analysis | grep -q "healthy"; do echo "Waiting for mysql-analysis..."; sleep 2; done'
          timeout 120 bash -c 'until docker compose -f docker-compose.ci.yml ps mysql-reports | grep -q "healthy"; do echo "Waiting for mysql-reports..."; sleep 2; done'

          echo "MySQL services are ready"
          docker compose -f docker-compose.ci.yml ps

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Setup Playwright browsers
        run: |
          # Instalar siempre para asegurar disponibilidad
          npx playwright install chromium --with-deps
          npx playwright --version
          echo "Playwright chromium installed successfully"

      - name: Setup test environment
        run: |
          echo "Creating test directories..."
          # Crear directorios en ubicaciones que accessibility-checker pueda necesitar
          mkdir -p .achecker_cache/engine
          mkdir -p /tmp/.achecker_cache/engine
          mkdir -p tmp/test-data
          chmod -R 777 .achecker_cache /tmp/.achecker_cache tmp 2>/dev/null || true

          # Verificar que se crearon correctamente
          ls -la .achecker_cache/
          ls -la /tmp/.achecker_cache/ 2>/dev/null || echo "/tmp/.achecker_cache not accessible"
          echo "Test directories created"

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          CI: true
          ANALYSIS_API_URL: http://localhost:8082
          REPORTS_API_URL: http://localhost:8083
          JEST_TIMEOUT: 60000
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          ACHECKER_CACHE_DIR: /tmp/.achecker_cache

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Playwright Status ==="
          npx playwright --version || echo "Playwright not found"
          echo "=== MySQL Status ==="
          docker compose -f docker-compose.ci.yml ps
          echo "=== MySQL Logs (last 30 lines) ==="
          docker compose -f docker-compose.ci.yml logs mysql-analysis --tail=30
          docker compose -f docker-compose.ci.yml logs mysql-reports --tail=30

      - name: Cleanup services
        if: always()
        run: |
          echo "Showing service logs..."
          docker compose -f docker-compose.ci.yml logs mysql-analysis mysql-reports || true
          echo "Stopping services..."
          docker compose -f docker-compose.ci.yml down -v

  docker-build-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-quality, test-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t accessibility-mw:${{ github.sha }} .
          docker tag accessibility-mw:${{ github.sha }} accessibility-mw:latest

      - name: Test Docker image
        run: |
          trap 'echo "Docker test failed. Capturing logs..."; docker logs test-container || echo "No logs available"; docker stop test-container 2>/dev/null || true' ERR

          docker run --rm -d --name test-container \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e DOCKER_ENV=true \
            -e PORT=3001 \
            -e HOST=0.0.0.0 \
            accessibility-mw:${{ github.sha }}

          HEALTH_CHECK_PASSED=false
          for i in {1..45}; do
            if curl -f http://localhost:3001/health 2>/dev/null; then
              echo "Health check passed"
              HEALTH_CHECK_PASSED=true
              break
            fi
            echo "Waiting for service... ($i/45)"
            sleep 2
          done

          if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
            echo "Health check timeout after 90 seconds"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

          echo "Running smoke tests..."
          if ! curl -f http://localhost:3001/health; then
            echo "Smoke test failed"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

          echo "All smoke tests passed"
          docker stop test-container

  ci-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-quality, test-unit, test-integration, docker-build-test]

    steps:
      - name: Generate CI Summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Code Quality: ${{ needs.build-and-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.test-integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build & Test: ${{ needs.docker-build-test.result }}" >> $GITHUB_STEP_SUMMARY
