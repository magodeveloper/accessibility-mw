name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Ejecutar semanalmente para verificar dependencias
    - cron: '0 6 * * 1'

env:
  NODE_VERSION: '20'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: ['20'] # Reducido a solo Node.js 20 para optimizar CI
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Playwright browsers
        run: npx playwright install chromium --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/playwright

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            dist/
            node_modules/.cache/
          key: build-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            build-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Lint code
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Build project
        run: npm run build

      - name: Bundle monitoring
        run: |
          npm run bundle:monitor
          npm run bundle:check
        continue-on-error: true

      - name: Upload bundle reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-reports-node${{ matrix.node-version }}
          path: |
            reports/bundle/
            !reports/bundle/*.json

      - name: Run unit tests
        run: cross-env ANALYSIS_API_URL=http://localhost:8082 jest tests/unit --testTimeout=15000 --coverage=false
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/playwright
          PLAYWRIGHT_HEADLESS: true

      - name: Run integration tests
        run: cross-env ANALYSIS_API_URL=http://localhost:8082 jest tests/integration --testTimeout=15000 --coverage=false
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/playwright
          PLAYWRIGHT_HEADLESS: true

      - name: Generate coverage report
        run: cross-env ANALYSIS_API_URL=http://localhost:8082 jest --coverage --testTimeout=15000
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/playwright
          PLAYWRIGHT_HEADLESS: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          # token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Build Docker image
        run: |
          docker build -t accessibility-mw:${{ github.sha }} .
          docker tag accessibility-mw:${{ github.sha }} accessibility-mw:latest

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container -p 3001:3001 accessibility-mw:${{ github.sha }}
          sleep 10
          curl -f http://localhost:3001/health || exit 1
          docker stop test-container

      - name: Security audit
        run: npm audit --audit-level=moderate --production
        continue-on-error: true

      - name: Bundle size trend analysis
        run: |
          if [ -d "dist" ]; then
            echo "=== Bundle Size Analysis ==="
            echo "Current bundle size:"
            du -sh dist/
            echo ""
            echo "Largest bundle files:"
            find dist -name "*.js" -exec ls -lh {} \; | sort -k5 -hr | head -10
            echo ""
            echo "Bundle composition:"
            find dist -type f -exec basename {} \; | sort | uniq -c | sort -nr
          fi
