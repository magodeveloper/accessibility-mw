name: Security Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Ejecutar diariamente a las 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite ejecución manual

env:
  NODE_VERSION: '20'

jobs:
  security-audit:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --production

      - name: NPM Audit (High/Critical)
        run: |
          echo "Running NPM Audit for high/critical vulnerabilities..."
          npm audit --audit-level=high --production || true
          echo "Generating detailed audit report..."
          npm audit --json --production > npm-audit-report.json || true

      - name: Upload NPM Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report-${{ github.sha }}
          path: npm-audit-report.json
          retention-days: 30

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --json > snyk-report.json

      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report-${{ github.sha }}
          path: snyk-report.json
          retention-days: 30

      - name: CodeQL Analysis - Initialize
        uses: github/codeql-action/init@v3
        id: codeql-init
        continue-on-error: true
        with:
          languages: javascript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        if: steps.codeql-init.outcome == 'success'
        continue-on-error: true

      - name: Docker Security Scan
        if: github.event_name != 'schedule'
        run: |
          echo "Building Docker image for security scan..."
          docker build -t accessibility-mw-security:latest .

          echo "Running Docker security scan..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/project \
            aquasec/trivy:latest image --exit-code 0 --no-progress --format json \
            --output /project/trivy-report.json accessibility-mw-security:latest || true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'schedule'
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.json
          retention-days: 30

      - name: Security Summary
        if: always()
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **NPM Audit**: $(test -f npm-audit-report.json && echo '[PASS] Completed' || echo '[FAIL] Failed')" >> $GITHUB_STEP_SUMMARY
          echo "- **Snyk Scan**: $(test -f snyk-report.json && echo '[PASS] Completed' || echo '[SKIP] Failed/Skipped (requires SNYK_TOKEN)')" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL**: $([[ '${{ steps.codeql-init.outcome }}' == 'success' ]] && echo '[PASS] Completed' || echo '[SKIP] Skipped (Code Scanning not enabled)')" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Scan**: $(test -f trivy-report.json && echo '[PASS] Completed' || echo '[SKIP] Skipped')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- **Enable Code Scanning**: Go to Settings -> Security & analysis -> Code scanning -> Set up -> Configure CodeQL" >> $GITHUB_STEP_SUMMARY
          echo "- **Add SNYK_TOKEN**: Add Snyk token to repository secrets for enhanced vulnerability scanning" >> $GITHUB_STEP_SUMMARY

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          deny-licenses: GPL-2.0, GPL-3.0
