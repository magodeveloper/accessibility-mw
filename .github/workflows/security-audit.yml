name: 🔒 Security Audit & Vulnerability Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Ejecutar diariamente a las 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Permite ejecución manual

env:
  NODE_VERSION: "20"

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: NPM Audit (High/Critical)
        run: |
          echo "Running NPM Audit for high/critical vulnerabilities..."
          npm audit --audit-level=high || true
          echo "Generating detailed audit report..."
          npm audit --json > npm-audit-report.json || true

      - name: Upload NPM Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report-${{ github.sha }}
          path: npm-audit-report.json
          retention-days: 30

  trivy-image-scan:
    name: Docker Image Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        run: |
          echo "Building Docker image for security scan..."
          docker build -t accessibility-mw-security:latest .

      - name: Run Trivy scan on image
        run: |
          echo "Running Trivy security scan..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/project \
            aquasec/trivy:latest image --exit-code 0 --no-progress --format json \
            --output /project/trivy-report.json accessibility-mw-security:latest || true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          deny-licenses: GPL-2.0, GPL-3.0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [npm-audit, trivy-image-scan]

    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "- NPM Audit: ${{ needs.npm-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy: ${{ needs.trivy-image-scan.result }}" >> $GITHUB_STEP_SUMMARY
