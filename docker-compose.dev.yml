version: '3.9'

services:
  accessibility-mw-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: accessibility-mw
    image: accessibility-mw:development
    container_name: accessibility-mw-dev
    env_file:
      - .env.development
    environment:
      # Override específico para Docker - usar host.docker.internal en Windows/Mac
      - ANALYSIS_API_URL=http://host.docker.internal:8082
      - HOST=0.0.0.0
      - NODE_OPTIONS=--enable-source-maps --max-old-space-size=1024
    ports:
      - '3001:3001'
    restart: unless-stopped
    shm_size: '512m'
    ulimits:
      nofile: 32768
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'
    tmpfs:
      - /app/logs
      - /app/.achecker_cache
      - /app/results:size=100m
    networks:
      - accessibility_network

networks:
  accessibility_network:
    driver: bridge
  dev_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
