version: '3.9'

services:
  accessibility-mw:
    build:
      context: .
      dockerfile: Dockerfile
      target: accessibility-mw
    image: accessibility-mw:production
    container_name: accessibility-mw
    env_file:
      - .env.production
    environment:
      - NODE_OPTIONS=--enable-source-maps --max-old-space-size=2048
      - ANALYSIS_API_URL=http://host.docker.internal:8082
    ports:
      - '3001:3001'
    restart: unless-stopped
    shm_size: '512m'
    ulimits:
      nofile: 32768
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    tmpfs:
      - /app/logs
      - /app/.achecker_cache
    networks:
      - accessibility_network

networks:
  accessibility_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
