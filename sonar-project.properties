# SonarQube Configuration for Accessibility Middleware
# Project identification
sonar.projectKey=accessibility-mw
sonar.projectName=Accessibility Middleware
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Language
sonar.language=ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts

# Test exclusions
sonar.test.exclusions=tests/**/*.ts

# Coverage exclusions
sonar.coverage.exclusions=tests/**,**/*.test.ts,**/*.spec.ts,**/*.config.ts,**/swagger.ts

# Ignore specific rules for test files
# S3776: Cognitive Complexity - Tests often need nested functions for setup/teardown
# S4138: Union types without type alias - Acceptable in tests for clarity
sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# Cognitive Complexity in tests
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.ts

# Union types in tests
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4328
sonar.issue.ignore.multicriteria.e2.resourceKey=tests/**/*.ts

# Too many parameters in test helper functions
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e3.resourceKey=tests/**/*.ts

# Duplicate string literals in tests (common for test descriptions)
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e4.resourceKey=tests/**/*.ts
